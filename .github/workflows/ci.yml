name: ci

# Python pinned to 3.12/3.13: that is where --strict reproduces the committed
# artefacts byte for byte. The code runs on 3.9+, but t2's log-log elasticity and
# m5's bootstrap CI drift in the last ~1e-15 on older libm builds. Float noise in
# the final aggregation, not a logic difference. See code/README.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # dev-only; no measurement imports them (--deps enforces it)
      - name: Install dev tools
        run: python -m pip install --upgrade pip mypy pytest

      - name: Stdlib-only (no undeclared third-party import)
        run: python code/run_all.py --deps

      - name: Reproduce every committed artefact byte-for-byte
        run: python code/run_all.py --strict

      - name: README claim ledger (prose == measurement)
        run: python code/p1_readme_check.py

      - name: Unit tests
        run: python -m pytest -q

      - name: Type-check the shared libraries (mypy --strict)
        run: >
          mypy --strict --config-file mypy.ini
          code/rpc_client.py code/statlib.py code/splitlib.py code/redact.py
          code/settings.py code/lib_verif.py code/hlib.py code/r1lib.py

      - name: Publication gate (no secrets; working tree clean)
        run: python code/check_no_secrets.py --require-clean
