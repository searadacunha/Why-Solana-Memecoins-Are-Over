name: Normalize research commit messages (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-history.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-research-history
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.repository == 'searadacunha/Why-Solana-Memecoins-Are-Over' && github.event.forced != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Verify original-history backup and prepare exact message plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup/original-commit-messages-2026-11-02
          test "$(git rev-parse FETCH_HEAD)" = '44bdf0dc1ad0f79bea6f64272ce1569feb987284'
          export ORIGINAL_HEAD="$(git rev-parse HEAD)"
          python3 scripts/rewrite_commit_messages.py --plan
          echo "ORIGINAL_HEAD=$ORIGINAL_HEAD" >> "$GITHUB_ENV"

      - name: Rewrite only messages and verify author, date, and tree preservation
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force \
            --msg-filter 'python3 "$GITHUB_WORKSPACE/scripts/rewrite_commit_messages.py" --filter-message' \
            -- main
          python3 scripts/rewrite_commit_messages.py --verify
          test "$(git rev-parse HEAD)" = "$(git rev-parse main)"

      - name: Publish rewritten history only if main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git push origin main:main --force-with-lease="refs/heads/main:${ORIGINAL_HEAD}"
          echo "Original history is retained in backup/original-commit-messages-2026-11-02."
