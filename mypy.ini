# mypy configuration for the typed shared libraries of code/.
#
# The dossier is stdlib-only Python 3.9+; the measurement scripts (m*/t*/a*/v*)
# are deliberately untyped analyst code and are NOT type-checked. The SHARED
# libraries every script leans on are, and they are checked in --strict:
#
#   mypy --strict --config-file mypy.ini \
#     code/rpc_client.py code/statlib.py code/splitlib.py \
#     code/redact.py code/settings.py code/lib_verif.py \
#     code/hlib.py code/r1lib.py
#
# (This is exactly what .github/workflows/ci.yml runs.)
[mypy]
python_version = 3.9
mypy_path = code
follow_imports = silent
ignore_missing_imports = True
namespace_packages = False
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
