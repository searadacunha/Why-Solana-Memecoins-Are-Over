# mypy configuration for the typed shared libraries of code/.
#
# The dossier is stdlib-only Python 3.9+. The line is drawn by role, not by how
# close a file happened to be to passing:
#
#   TYPE-CHECKED -- the shared libraries every script leans on, and the tooling
#   that decides what the dossier publishes (the reproduction runner, the
#   publication gate, the two redaction tools). A wrong type there is a wrong
#   verdict about the whole repository.
#
#   NOT TYPE-CHECKED -- the measurement scripts (0*, m*, t*, a*, v*, r1*, f*).
#   Deliberately untyped analyst code: they are read for what they compute.
#
#   mypy --strict --config-file mypy.ini \
#     code/rpc_client.py code/statlib.py code/splitlib.py \
#     code/redact.py code/settings.py code/lib_verif.py \
#     code/hlib.py code/r1lib.py \
#     code/run_all.py code/check_no_secrets.py \
#     code/build_redactions.py code/sanitize_data.py
#
# (This is exactly what .github/workflows/ci.yml runs.)
[mypy]
python_version = 3.10
mypy_path = code
follow_imports = silent
ignore_missing_imports = True
namespace_packages = False
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
